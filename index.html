<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0f0e" />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="One Ping" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>One Ping</title>
    <meta
      name="description"
      content="One Ping：查看出口 IP、归属地、运营商、IP 风险、AI 连通性、DNS、WebRTC 与全球 Ping。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/app-icon-192.png" />
    <script>
      // Classic ES5 script: IE cannot execute the application's module bundle.
      (function () {
        var root = document.documentElement;
        // Fallback only: production must also send frame-ancestors / X-Frame-Options.
        if (window.self !== window.top) {
          root.className = "embedded-browser";
          return;
        }
        if (document.documentMode || /MSIE|Trident/.test(navigator.userAgent)) {
          root.className = "unsupported-browser";
          return;
        }
        try {
          var theme = localStorage.getItem("theme") || "dark";
          var dark = theme !== "light";
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
          ["color", "radius", "layout", "font-size"].forEach(function (key) {
            var value = localStorage.getItem("ui-" + key);
            if (value && value !== "default")
              root.setAttribute("data-" + key, value);
          });
        } catch (error) {
          // Keep the page usable when browser storage is unavailable.
        }
      })();
    </script>
    <style>
      html {
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
      }

      .embedded-browser body {
        display: none !important;
      }

      #unsupported-browser {
        display: none;
      }

      .unsupported-browser #root {
        display: none;
      }

      .unsupported-browser #unsupported-browser {
        display: block;
        max-width: 640px;
        margin: 80px auto;
        padding: 24px;
        font-family: sans-serif;
        line-height: 1.8;
        color: #171717;
        background: #fff;
      }
    </style>
  </head>

  <body>
    <!--
    THESIS: A live split-route console led by evidence, refusing the generic grid of disconnected utility cards.
    OWN-WORLD: Ink and paper neutrals, terminal green signals, compact ruled panels, and the wide-eyed OU cat as a watchful instrument mark.
    STORY: Read the current exits, compare where sites actually leave, then continue into focused network, Claude, browser, or status diagnostics.
    FIRST VIEWPORT: Branded command bar above two prominent live exit dossiers and an immediately visible route summary; refresh stays at the upper right.
    FORM: User-pinned observatory refined into an operator console; seed f0168880.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
  -->
    <div id="unsupported-browser" role="alert">
      <h1>不支持 Internet Explorer</h1>
      <p>
        请使用最新版 Microsoft Edge、Google Chrome、Firefox 或 Safari 访问本站。
      </p>
      <a href="https://www.microsoft.com/edge">下载 Microsoft Edge</a>
    </div>
    <noscript>请启用 JavaScript，并使用现代浏览器访问本站。</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
